[project]
name = "almost-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "魏佳楠", email = "weijianan@szkingdom.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "openai>=3.33.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
almost-agent = "ai_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

