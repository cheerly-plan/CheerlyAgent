services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: root
      # 密码从 .env 读取（POSTGRES_PASSWORD），不再硬编码进仓库
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ai_agent
    ports:
      # 只绑定本机回环地址，避免数据库暴露到局域网
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
