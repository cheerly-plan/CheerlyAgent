# 经营解读启发式：证据召回词、原文清洗禁词、结构共现线索。
# 改这里即可调「搜什么／丢什么／何时写结构并列句」，不必改 analyze.py。
# 数字与归因门禁仍在 Python；本文件不得夹带要写入正文的定量结论。

# KB 关键词召回（经营分析／变动原因等段落）
evidence_keywords:
  - 经营情况简要分析
  - 经营情况讨论与分析
  - 主要会计数据、财务指标发生变动的情况、原因
  - 净息差
  - 不良贷款
  - 拨备覆盖率
  - 营业收入
  - 净利润
  - 毛利率
  - 研发费用
  - 研发投入
  - 产能利用率
  - 量价齐升

# 单家「与原文并列」结构句：仅当原文出现这些用语才写（label / 匹配子串）
structure_narrative_cues:
  - [量价齐升, 量价]
  - [毛利润增加, 毛利润增加]

# 无 LLM 时筛选经营原文的内容词
operating_snippet_keys:
  - 量价
  - 存储
  - 出货
  - 毛利润增加
  - 经营业绩
  - 产能
  - 研发

# 封测／制造正文不该出现的跨行业科目残留
cross_industry_accounts:
  - 退保金
  - 赔付支出
  - 保单红利
  - 提取保险责任准备金
  - 分保费用
  - 净息差
  - 不良贷款
  - 拨备覆盖率
  - 利息净收入
