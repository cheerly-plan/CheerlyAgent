# 行业指标 bundle：按 company_type 选取 include / exclude（中文报表术语）。
# 分类逻辑仍在 industry.py；本文件只声明指标组合。
# sets 可被 profiles.exclude_refs 引用，避免重复粘贴银行专属指标。

sets:
  bank_only: &bank_only
    - 净息差
    - 拨备前利润
    - PPOP
    - 不良贷款率
    - 不良贷款拨备覆盖率
    - 资本充足率
    - 核心一级资本充足率
    - 成本收入比
    - 利息净收入
    - 非利息收入
    - 非利息收入占比
    - 发放贷款和垫款总额
    - 吸收存款总额
  bank_exclude:
    - 毛利率
    - 存货周转率
    - 研发费用率
    - 产能利用率
    - 合同负债

profiles:
  bank:
    include:
      - 营业收入
      - 净利润
      - 利润总额
      - 归属于母公司所有者的净利润
      - 利息净收入
      - 非利息收入
      - 非利息收入占比
      - 手续费及佣金净收入
      - 业务及管理费
      - 成本收入比
      - 资产减值损失
      - 净息差
      - 平均总资产回报率
      - 不良贷款率
      - 不良贷款拨备覆盖率
      - 加权平均净资产收益率
      - 发放贷款和垫款总额
      - 吸收存款总额
      - 资产总计
      - 核心一级资本充足率
      - 资本充足率
    exclude_refs: [bank_exclude]

  fabless:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 研发费用率
      - 存货周转率
      - 大客户集中度
      - 经营活动产生的现金流量净额
    exclude_refs: [bank_only]
    exclude: [产能利用率]

  foundry:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 产能利用率
      - 折旧
      - 资本开支
      - 存货
      - 经营活动产生的现金流量净额
    exclude_refs: [bank_only]
    exclude: [大客户集中度]

  equipment:
    # 订单先行：合同负债／存货／在手订单占组内前六列；经营现金流超出预算仍补列。
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 合同负债
      - 存货
      - 在手订单
      - 研发费用率
      - 经营活动产生的现金流量净额
    exclude_refs: [bank_only]
    exclude: [产能利用率, 存货周转率, 资产负债率]

  packaging:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 产能利用率
      - 资本开支
      - 经营活动产生的现金流量净额
    exclude_refs: [bank_only]
    exclude: [大客户集中度]

  manufacturing:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 存货周转率
      - 经营活动产生的现金流量净额
      - 产能利用率
      - 资产负债率
    exclude_refs: [bank_only]

  software:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 研发费用率
      - 经营活动产生的现金流量净额
      - 合同负债
    exclude_refs: [bank_only]
    exclude: [存货周转率, 产能利用率, 资本开支]

  real_estate:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 合同负债
      - 经营活动产生的现金流量净额
      - 资产负债率
    exclude_refs: [bank_only]
    exclude: [研发费用率, 产能利用率]

  cyclical:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 产能利用率
      - 资本开支
      - 存货
      - 经营活动产生的现金流量净额
    exclude_refs: [bank_only]
    exclude: [研发费用率, 大客户集中度]

  # 行业横比共用集：各赛道都能对上的少数指标；组内细项由 segment 模板补。
  semiconductor:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 研发费用率
      - 经营活动产生的现金流量净额
    exclude: *bank_only

  generic:
    include:
      - 营业收入
      - 扣非净利润
      - 毛利率
      - 存货周转率
      - 经营活动产生的现金流量净额
      - 资产负债率
    exclude: *bank_only
