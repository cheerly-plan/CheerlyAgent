# 研报统一配置（P0 全量收敛）——指标元数据、成员资格、有序名单、分类规则。
#
# 边界：这里只描述「有哪些指标、怎么认出它们、属于哪些语义组」，绝不承载
# 计算逻辑、数字或校验替换；抽数 / 同比环比 / 数字校验 / PDF 渲染仍是
# 确定性 Python，防幻觉门禁不被配置绕过。
#
# 新增一个指标 = 在本文件加一段（或给已有段补 flag），不再去 8 个模块里
# 补名单。flags 的 key 就是原先散落在各模块的具名名单：
#   money_validation / money_pick_facts / money_wide_table / money_cell_unit /
#   amount_abstract / narrative_first / chart_default / point_in_time /
#   stock_name / unannotated_ratio / equity_composition / asset_driver /
#   profit_name / balance_move_name / balance_* / year_end_* / bank_lead_hint 等
# 每个语义组单独一个 key，是为了保持迁移前各组之间的成员差异（例如金额
# 白名单 10 项 vs 宽表 8 项 vs 单元格 7 项）——统一口径会悄悄改掉正文。
#
# ordering 放顺序敏感 / 标量参数（结论优先级、默认指标集、截断条数等）。
# classification 放公司名关键字与赛道映射。
#
# 维护方式：改完本文件后运行 `uv run python scripts/sync_indicators_snapshot.py`
# 同步只读降级镜像（registry 在主配置损坏时会回退到镜像）。
# tests/test_report_registry.py::test_snapshot_matches_shipped_config 会在 CI
# 里拦截「改了主配置忘了同步」；同一文件里还有各语义组成员差异的回归用例，
# 新增指标时请一并确认该指标是否需要加入对应的 flags 具名组。

version: 1
