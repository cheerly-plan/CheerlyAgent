name: 评测门禁

# PR / push：T0 静态门禁 + 独立的 memory-e2e job（确定性、零模型密钥、带 pgvector）。
# nightly / 手动触发：配置了 EVAL_DOTENV secret 时跑 T0+T1+T2，其中
# eval_memory 是 blocking；未配置时自动降级为只跑 T0。
# 记忆 E2E 只在下面的独立 job 跑一次：eval/config.json 不再重复注册该 suite，
# 否则 nightly 会在两个 job 里各跑一遍。
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 北京时间次日 02:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --group dev

      - name: 确认基线已提交
        run: |
          if [ ! -f eval/baseline.json ]; then
            echo "::error::eval/baseline.json 未提交进仓库，门禁无法做相对基线 diff"
            exit 1
          fi

      - name: 准备评测配置
        env:
          EVAL_DOTENV: ${{ secrets.EVAL_DOTENV }}
        run: |
          if [ -n "$EVAL_DOTENV" ]; then
            printf '%s\n' "$EVAL_DOTENV" > .env
            echo "EVAL_ENV_READY=true" >> "$GITHUB_ENV"
            echo "使用仓库 secret EVAL_DOTENV，T1/T2 可用"
          else
            # config.py 在模块级执行 settings = Settings()，9 个字段无默认值；
            # 缺任一都会让 tests/test_eval_retrieval.py 在 import 阶段直接崩掉。
            # 这里只填占位值让 T0 能 import：T0 不连库、不调模型。
            # 值本身不是凭据；真凭据走上面的 EVAL_DOTENV。
            printf '%s\n' \
              'BASE_URL=http://127.0.0.1:1/v1' \
              'API_KEY=ci-placeholder' \
              'MODEL=ci-placeholder' \
              'DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/ci' \
              'EMBEDDING_MODEL=ci-placeholder' \
              'EMBEDDING_DIM=8' \
              'MEMORY_TOP_K=5' \
              'MEMORY_SCORE_THRESHOLD=0.5' \
              'SHORT_TERM_MEMORY_MAX_TOKENS=2000' > .env
            echo "EVAL_ENV_READY=false" >> "$GITHUB_ENV"
            echo "::warning::未配置 EVAL_DOTENV，本次只跑 T0 静态门禁"
            # job 仍是 success，容易被误读成"全量评测通过"。把降级事实写进
            # run summary，让 PR / nightly 页面上一眼能看见 T1/T2 没跑。
            {
              echo "### 评测门禁已降级"
              echo ""
              echo "- 本次只执行 **T0**：评测脚本自测、ruff、用例集 schema。"
              echo "- **T1/T2 未执行**：仓库缺少 EVAL_DOTENV secret。"
              echo "- 本次 PASS 只代表静态层，不代表检索 / 记忆 / 工具选择质量。"
              echo "- nightly 与手动触发需配置该 secret 才会连库、调模型。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          chmod 600 .env

      - name: 运行评测门禁
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "push" ]; then
            uv run python scripts/eval_run.py --tiers 0
          elif [ "$EVAL_ENV_READY" = "true" ]; then
            uv run python scripts/eval_run.py --tiers 0,1,2 --allow-external
          else
            uv run python scripts/eval_run.py --tiers 0
          fi

      - name: 上传报告与趋势
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: |
            data/eval/runs/*.json
            data/eval/trend.jsonl
          if-no-files-found: ignore

  memory-e2e:
    # 确定性记忆生命周期门禁：不需要模型密钥，PR / push / nightly 都跑。
    # 覆盖 写入 → 注入 → 晋升 → 归档 → 删除，DB 用 pgvector 服务。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --group dev

      - name: 准备数据库配置
        run: |
          printf '%s\n' \
            'BASE_URL=http://127.0.0.1:1/v1' \
            'API_KEY=ci-placeholder' \
            'MODEL=ci-placeholder' \
            'DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/ai_agent' \
            'EMBEDDING_MODEL=ci-placeholder' \
            'EMBEDDING_DIM=8' \
            'MEMORY_TOP_K=5' \
            'MEMORY_SCORE_THRESHOLD=0.5' \
            'SHORT_TERM_MEMORY_MAX_TOKENS=2000' > .env
          chmod 600 .env

      - name: 初始化 pgvector 扩展
        # ConnectionPool(open=True) 建池时就 configure → register_vector，要求
        # vector 类型已存在；ensure_schema() 又要先拿到池连接才能建扩展，空库会
        # 卡成 PoolTimeout（历史三次 nightly 红灯）。pg_isready 只探端口、不检查
        # 扩展，所以跑测试前必须用一条不入池的短连接显式建一次。
        run: |
          uv run python - <<'PY'
          import psycopg
          from ai_agent.core.config import settings

          with psycopg.connect(settings.database_url) as conn:
              conn.execute("CREATE EXTENSION IF NOT EXISTS vector")
              row = conn.execute(
                  "SELECT extversion FROM pg_extension WHERE extname = 'vector'"
              ).fetchone()
          print("pgvector 扩展版本:", row[0] if row else "未安装")
          assert row, "pgvector 扩展未安装，memory-e2e 会在连接池阶段超时"
          PY

      - name: 运行记忆端到端门禁
        env:
          MEMORY_E2E_REQUIRED: "1"
        run: uv run pytest tests/test_memory_e2e.py -q
