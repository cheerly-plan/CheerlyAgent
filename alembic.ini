# Alembic 配置（精简版：去掉了上游模板里全部注释掉的示例项）。
#
# 连接串刻意不在这里设置：src/ai_agent/migrations/env.py 从
# core.config.settings.database_url 读取（与运行时同源），
# 这里的 sqlalchemy.url 从来不会生效。
#
# 下面保留的是实际生效的配置；其余均为 Alembic 默认行为。

[alembic]
script_location = %(here)s/src/ai_agent/migrations
prepend_sys_path = %(here)s/src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
